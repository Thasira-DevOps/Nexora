<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexora</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
<h1>Nexora</h1>

<section id="cookie-jar">
    <h2>🍪 Cookie Jar</h2>
    <textarea id="cookie-input" placeholder="Write something that makes you happy or motivated..."></textarea>
    <button id="add-cookie">Add to jar</button>
    <button id="pull-cookie">Pull a cookie</button>
    <p id="cookie-display"></p>
</section>
<section id="notes">
    <h2>📝 Notes & Reminders</h2>
    <input id="note-title" type="text" placeholder="Title">
    <textarea id="note-body" placeholder="Details (optional)"></textarea>
    <label>Remind me at (optional):
        <input id="note-due" type="datetime-local">
    </label>
    <button id="add-note">Save note</button>
    <ul id="note-list"></ul>
</section>

<section id="backup">
    <h2>💾 Backup</h2>
    <button id="export-data">Export all data</button>
    <label>Import backup:
        <input id="import-file" type="file" accept=".json,application/json">
    </label>
    <p id="backup-status"></p>
</section>

<script src="js/app.js"></script>
</body>
</html>
